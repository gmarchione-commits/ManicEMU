name: Build IPA v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ManicEmu/ManicEmu.xcodeproj \
            -scheme ManicEmuSideload \
            -configuration SideloadRelease \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" build.log | head -30; tail -n 25 build.log; exit 1; }

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" | grep -vi jit | head -1)
          echo "App: $APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr App.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: App.ipa
          if-no-files-found: error
