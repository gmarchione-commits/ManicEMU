name: Build IPA Claude

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Xcode piu recente
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Mostra cosa c'e nel repository
        run: |
          echo "== Cartelle principali =="
          ls
          echo "== Progetti trovati =="
          find . -maxdepth 4 \( -name "*.xcworkspace" -o -name "*.xcodeproj" -o -name "Podfile" -o -name "Package.swift" \) -not -path "*/Pods/*" -not -path "*.xcodeproj/*" | head -50

      - name: Pod install se serve
        run: |
          PODFILE=$(find . -maxdepth 4 -name Podfile -not -path "*/Pods/*" | head -n 1)
          if [ -n "$PODFILE" ]; then
            cd "$(dirname "$PODFILE")"
            pod install
          fi

      - name: Trova workspace e scheme dell'app iOS
        run: |
          WS=$(find . -maxdepth 4 -name "*.xcworkspace" -not -path "*/Pods/*" -not -path "*.xcodeproj/*" | head -n 1)
          if [ -n "$WS" ]; then
            FLAG="-workspace"; TARGET="$WS"; KEY="workspace"
          else
            PROJ=$(find . -maxdepth 4 -name "*.xcodeproj" -not -path "*/Pods/*" | head -n 1)
            FLAG="-project"; TARGET="$PROJ"; KEY="project"
          fi
          if [ -z "$TARGET" ]; then
            echo "Nessun progetto Xcode trovato"
            exit 1
          fi
          echo "Uso: $FLAG $TARGET"
          SCHEMES=$(xcodebuild $FLAG "$TARGET" -list -json | python3 -c "import sys,json; print('\n'.join(json.load(sys.stdin)['$KEY']['schemes']))")
          echo "Scheme trovati:"
          echo "$SCHEMES"
          ORDERED=$( { echo "$SCHEMES" | grep -i manic || true; echo "$SCHEMES" | grep -vi manic || true; } )
          SCHEME=""
          while IFS= read -r S; do
            [ -z "$S" ] && continue
            if xcodebuild $FLAG "$TARGET" -scheme "$S" -sdk iphoneos -configuration Release -showBuildSettings 2>/dev/null | grep -Eq "PRODUCT_TYPE = com.apple.product-type.application[[:space:]]*$"; then
              SCHEME="$S"
              echo "Scheme dell'app iOS: $S"
              break
            fi
          done <<< "$ORDERED"
          if [ -z "$SCHEME" ]; then
            echo "Nessuno scheme di app iOS trovato"
            exit 1
          fi
          echo "FLAG=$FLAG" >> "$GITHUB_ENV"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

      - name: Compila senza firma
        run: |
          set -o pipefail
          xcodebuild $FLAG "$TARGET" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Crea IPA
        run: |
          APP=$(find build/Build/Products -maxdepth 3 -name "*.app" | head -n 1)
          echo "App trovata: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr ManicEMU.ipa Payload

      - name: Salva IPA
        uses: actions/upload-artifact@v4
        with:
          name: ManicEMU-ipa
          path: ManicEMU.ipa

      - name: Salva log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
